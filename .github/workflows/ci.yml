name: CI - Build & OWASP Dependency-Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean verify

      # Cache de la base NVD : evite de la retelecharger a chaque run
      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: depcheck-data-${{ github.run_id }}
          restore-keys: |
            depcheck-data-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ARGS=""
          if [ -n "$NVD_API_KEY" ]; then
            echo "Cle NVD detectee : mise a jour rapide."
            ARGS="-DnvdApiKey=$NVD_API_KEY"
          else
            echo "Pas de cle NVD : mise a jour lente (rate limit), le premier run peut durer longtemps."
            ARGS="-DnvdApiDelay=8000"
          fi
          mvn -B org.owasp:dependency-check-maven:13.0.0:check \
            $ARGS \
            -Dformats=HTML,JSON \
            -DfailBuildOnCVSS=11

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: warn
