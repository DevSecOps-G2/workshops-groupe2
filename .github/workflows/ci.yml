name: CI - Build & OWASP Dependency-Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    env:
      # true seulement si le secret existe ET n'est pas vide
      HAS_NVD_KEY: ${{ secrets.NVD_API_KEY != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean verify

      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: depcheck-data-${{ github.run_id }}
          restore-keys: |
            depcheck-data-

      # Avec cle NVD (rapide). La variable n'est definie que dans ce step.
      - name: Run OWASP Dependency-Check (with NVD key)
        if: env.HAS_NVD_KEY == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:13.0.0:check \
            -DnvdApiKey="$NVD_API_KEY" \
            -Dformats=HTML,JSON \
            -DfailBuildOnCVSS=11

      # Sans cle NVD (lent). NVD_API_KEY n'existe pas du tout dans l'environnement.
      - name: Run OWASP Dependency-Check (no NVD key)
        if: env.HAS_NVD_KEY != 'true'
        run: |
          echo "Pas de secret NVD_API_KEY : mise a jour lente (rate limit)."
          mvn -B org.owasp:dependency-check-maven:13.0.0:check \
            -DnvdApiDelay=8000 \
            -Dformats=HTML,JSON \
            -DfailBuildOnCVSS=11

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: warn
